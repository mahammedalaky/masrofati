<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروفاتي</title>
<meta name="description" content="تطبيق لتتبع مصروفاتك اليومية بالصوت مع ميزانيات لكل تصنيف وتقارير يومية وشهرية">
<link rel="manifest" href="manifest.json">

<!-- الأيقونات -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<!-- إعدادات تشغيله كتطبيق مستقل على آيفون -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">

<!-- إعدادات تشغيله كتطبيق مستقل على أندرويد -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1f3a">

<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;padding:15px;margin:0;font-size:17px;line-height:1.6}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:15px}
.head{background:#0b1f3a;color:white;border-radius:20px;padding:20px;position:relative}
h1{font-size:27px;font-weight:800}
h2{font-size:20px;font-weight:700}
button,input,textarea,select{width:100%;padding:14px;margin-top:10px;border-radius:12px;font-size:17px;border:1px solid #ddd;font-family:inherit}
button{background:#0b1f3a;color:white;border:0;cursor:pointer;font-weight:700}
button.secondary{background:#fff;color:#0b1f3a;border:1px solid #0b1f3a}
button.danger{background:#fdecea;color:#b3261e;border:1px solid #f5c2c0}
button.small{width:auto;padding:8px 12px;margin:0;font-size:14px}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1;margin-top:10px}
.bar-outer{background:#e5e9ef;border-radius:10px;height:10px;overflow:hidden;margin-top:12px}
.bar-inner{height:100%;border-radius:10px;transition:width .3s ease;background:#4caf50}
.banner{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:15px;font-weight:700}
.banner.ok{background:#e8f5e9;color:#1b5e20}
.banner.mid{background:#fff8e1;color:#8d6e00}
.banner.over{background:#fdecea;color:#b3261e}
.banner.neutral{background:rgba(255,255,255,.15);color:#fff}
#preview{color:#555;font-size:14px;min-height:18px;margin-top:8px;font-weight:600}
.cat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;font-size:15px}
.cat-row:last-child{border-bottom:0}
.exp-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;padding:12px 0}
.exp-item:last-child{border-bottom:0}
.exp-info{flex:1;min-width:0}
.exp-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exp-cat{display:inline-block;background:#eef2f7;color:#0b1f3a;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
.exp-amount{font-weight:800;font-size:16px}
.exp-text{color:#555;font-size:14px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-date{color:#999;font-size:12px;margin-top:2px}
.del-btn{background:#fdecea;color:#b3261e;border:1px solid #f5c2c0;border-radius:10px;padding:8px 12px;width:auto;margin:0 0 0 10px;font-size:16px;flex-shrink:0}
.muted{color:#999;text-align:center;padding:10px 0}
.chip-row{display:flex;justify-content:space-between;align-items:center;background:#f7f9fc;border-radius:10px;padding:8px 12px;margin-top:8px;gap:8px}
.chip-row .chip-name{font-size:14px;flex:1;min-width:0}
.chip-row .cat-budget-input{width:90px;flex:none;margin:0;padding:8px;font-size:13px}
.cat-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin:0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.cat-card{flex:0 0 160px;scroll-snap-align:start;background:#f7f9fc;border-radius:14px;padding:12px;border:2px solid transparent;cursor:pointer}
.cat-card.armed{border-color:#0b1f3a;background:#e8edf7}
.cat-armed-badge{font-size:11px;color:#0b1f3a;font-weight:bold;margin-top:8px}
.armed-indicator{display:flex;justify-content:space-between;align-items:center;background:#eaf0fb;border:1px solid #c9d6ec;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px;color:#0b1f3a}
.cat-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.cat-card-name{font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-card .cat-del{background:transparent;border:0;color:#b3261e;width:auto;padding:0;margin:0;font-size:18px;cursor:pointer;flex-shrink:0}
.cat-card label{font-size:12px;color:#888;display:block;margin-top:8px}
.cat-card input[type=number]{padding:6px 8px;font-size:14px;margin-top:2px;border-radius:8px}
.cat-card .cat-stat{font-size:13px;color:#555;margin-top:6px;font-weight:600}
.cat-card .cat-remaining{font-weight:800;font-size:14px;margin-top:6px}
.cat-total-row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-top:4px;padding-top:14px;border-top:1px solid #eee}
.head-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.nav-row{display:flex;gap:6px;flex-wrap:wrap}
.nav-row button{width:auto;padding:6px 10px;margin:0;font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
.nav-row button.active{background:#fff;color:#0b1f3a}
.lang-row{display:flex;gap:4px}
.lang-row button{width:auto;padding:6px 10px;margin:0;font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
.lang-row button.active{background:#fff;color:#0b1f3a}
.hint{color:#888;font-size:12px;margin-top:6px}
.lock-overlay{position:fixed;inset:0;background:#0b1f3a;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.lock-box{background:#fff;border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);display:flex;align-items:center;justify-content:center;z-index:1001;padding:20px}
.modal-box{background:#fff;border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.modal-icon{font-size:32px;margin-bottom:6px}
.modal-msg{font-size:16px;font-weight:700;color:#222;line-height:1.6;margin:0 0 20px;white-space:pre-line}
.modal-actions{display:flex;gap:10px}
.modal-actions button{margin:0}
.back-btn{width:auto;padding:8px 14px;margin:0 0 12px;font-size:14px}
.tab-row{display:flex;gap:8px;margin-top:10px}
.tab-row button{width:auto;flex:1;margin:0;padding:10px;font-size:14px;background:#f0f2f5;color:#333;border:0}
.tab-row button.active{background:#0b1f3a;color:#fff}
.period-total{font-weight:800;margin-top:12px;font-size:17px}
#b,#s{font-weight:800;font-size:19px}
.splash{position:fixed;inset:0;background:#0b1f3a;display:flex;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s ease;cursor:pointer}
.splash img{width:96px;height:96px;border-radius:24px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.splash-title{color:#fff;font-size:26px;font-weight:800;margin:0 0 8px}
.splash-credit{color:rgba(255,255,255,.85);font-size:14px;margin:0;font-weight:600}
[dir="ltr"] .del-btn{margin:0 10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="splashScreen" class="splash" onclick="dismissSplash()">
 <div style="text-align:center">
  <img src="icons/icon-192.png" alt="">
  <p class="splash-title">مصروفاتي 🎤</p>
 </div>
</div>

<div id="confirmModal" class="modal-overlay" hidden>
 <div class="modal-box">
  <div class="modal-icon">⚠️</div>
  <p id="confirmModalMsg" class="modal-msg"></p>
  <div class="modal-actions">
   <button id="confirmModalYes" onclick="resolveConfirmModal(true)"></button>
   <button class="secondary" id="confirmModalNo" onclick="resolveConfirmModal(false)"></button>
  </div>
 </div>
</div>

<div id="alertModal" class="modal-overlay" hidden>
 <div class="modal-box">
  <div class="modal-icon" id="alertModalIcon">ℹ️</div>
  <p id="alertModalMsg" class="modal-msg"></p>
  <div class="modal-actions">
   <button id="alertModalOk" onclick="closeAlertModal()"></button>
  </div>
 </div>
</div>

<div id="lockScreen" class="lock-overlay" style="display:none">
 <div class="lock-box">
  <h2 id="lockTitle">🔒</h2>
  <input type="password" id="lockPinInput" inputmode="numeric">
  <button onclick="tryUnlock()" id="unlockBtn"></button>
  <p id="lockWrongMsg" style="color:#b3261e;font-size:13px;display:none"></p>
 </div>
</div>

<div id="app">

<div class="head">
 <div class="head-top">
  <div class="nav-row">
   <button id="navHomeBtn" onclick="showView('home')"></button>
   <button id="navReportsBtn" onclick="showView('reports')"></button>
   <button id="navSettingsBtn" onclick="showView('settings')"></button>
  </div>
  <div class="lang-row">
   <button id="langArBtn" onclick="setLang('ar')">عربي</button>
   <button id="langEnBtn" onclick="setLang('en')">EN</button>
  </div>
 </div>
 <p id="periodCaption" style="margin:14px 0 8px;font-size:12px;opacity:.8"></p>
 <p style="margin:4px 0"><span id="budgetLabel"></span>: <span id="b">0</span> <span class="cur"></span></p>
 <p style="margin:4px 0"><span id="spentLabel"></span>: <span id="s">0</span> <span class="cur"></span></p>
 <div class="bar-outer"><div class="bar-inner" id="bar" style="width:0%"></div></div>
 <div id="banner" class="banner neutral"></div>
</div>

<!-- ============ الرئيسية ============ -->
<div id="viewHome">

<div class="card">
<h2 id="categoriesHeader"></h2>
<div class="row">
 <input id="newCategoryInput">
 <input id="newCategoryBudget" type="number" inputmode="decimal" style="flex:0 0 110px">
 <button onclick="addCategory()" id="addCategoryBtn" style="flex:0 0 auto;width:auto;padding:14px 18px"></button>
</div>
<div id="categoryList" class="cat-scroll"></div>
<div id="categoryTotalRow" class="cat-total-row"></div>
</div>

<div class="card">
<h2 id="addExpenseHeader"></h2>
<button onclick="startVoice()" id="voiceBtn"></button>
<p id="status"></p>
<textarea id="text" style="height:80px" oninput="updatePreview()" onkeydown="handleTextKeydown(event)"></textarea>
<p id="preview"></p>
<div id="armedIndicator" class="armed-indicator" hidden>
 <span id="armedIndicatorText"></span>
 <button type="button" class="cat-del" onclick="unarmCategory()">×</button>
</div>
<label id="categoryLabel" style="font-size:13px;color:#555"></label>
<select id="categorySelect"></select>
<p id="manualSaveHint" class="hint"></p>
</div>

</div>

<!-- ============ التقارير ============ -->
<div id="viewReports" hidden>
<div class="card">
<button class="secondary back-btn" onclick="showView('home')" id="backFromReports"></button>
<h2 id="reportsHeader"></h2>
<div id="reportCategoryFilter" class="armed-indicator" hidden>
 <span id="reportCategoryFilterText"></span>
 <button type="button" class="cat-del" onclick="unarmCategory()">×</button>
</div>
<div class="tab-row">
 <button id="tabDailyBtn" onclick="switchReportTab('daily')"></button>
 <button id="tabMonthlyBtn" onclick="switchReportTab('monthly')"></button>
 <button id="tabAllBtn" onclick="switchReportTab('all')"></button>
</div>
<div id="dailyPicker" hidden>
 <label id="dailyDateLabel" style="font-size:13px;color:#555"></label>
 <input type="date" id="reportDateInput" onchange="onReportDateChange()">
</div>
<div id="monthlyPicker" hidden>
 <label id="monthlyDateLabel" style="font-size:13px;color:#555"></label>
 <input type="month" id="reportMonthInput" onchange="onReportMonthChange()">
</div>
<div id="periodTotal" class="period-total"></div>
<div id="periodCatReport" style="margin-top:8px"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 id="expenseLogHeader" style="margin:0"></h2>
<button class="danger small" onclick="clearAllExpenses()" id="clearAllBtn"></button>
</div>
<div id="periodExpenseList"></div>
</div>
</div>

<!-- ============ الإعدادات ============ -->
<div id="viewSettings" hidden>

<div class="card">
<button class="secondary back-btn" onclick="showView('home')" id="backFromSettings"></button>
<h2 id="countryHeader"></h2>
<label id="countryLabel" style="font-size:13px;color:#555"></label>
<select id="countrySelect" onchange="setCountry(this.value)"></select>
<p id="countryHint" class="hint"></p>
</div>

<div class="card">
<h2 id="profileHeader"></h2>
<label id="occupationLabel" style="font-size:13px;color:#555"></label>
<input id="occupationInput">
<button onclick="saveProfile()" id="saveProfileBtn"></button>
<button class="danger" onclick="deleteProfileData()" id="deleteProfileBtn" style="margin-top:20px"></button>
</div>

<div class="card">
<h2 id="pinHeader"></h2>
<p class="hint" id="pinHint"></p>
<input type="password" id="newPinInput" inputmode="numeric">
<div class="row">
 <button onclick="setPin()" id="setPinBtn"></button>
 <button class="danger" onclick="removePin()" id="removePinBtn"></button>
</div>
</div>

<div class="card">
<h2 id="backupHeader"></h2>
<button class="secondary" onclick="exportBackup()" id="exportBtn"></button>
<button class="secondary" onclick="document.getElementById('importFile').click()" id="importBtn"></button>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
</div>

</div>

</div>

/* ============ فهم الأرقام المنطوقة بالعربي ============ */
function arabicWordsToNumber(text){
 // يشمل الفصحى وصيغ دارجة ليبية شائعة (إبدال الثاء تاء: ثلاثة/تلاتة، ثمانية/تمانية)
 const ones={'صفر':0,'واحد':1,'احد':1,'إحدى':1,'احدى':1,'اثنا':2,'اثني':2,'اثنان':2,'اثنين':2,'ثنين':2,
  'ثلاثة':3,'ثلاث':3,'تلاتة':3,'تلاته':3,'تلات':3,
  'أربعة':4,'اربعة':4,'أربع':4,'اربع':4,
  'خمسة':5,'خمس':5,'ستة':6,'ست':6,'سبعة':7,'سبع':7,
  'ثمانية':8,'ثمان':8,'تمانية':8,'تمانيه':8,'تمان':8,
  'تسعة':9,'تسع':9};
 // صيغ ليبية دارجة مركّبة لأرقام 11-19 (حداشر، اثناشر...) تُقرأ ككلمة وحدة
 const teensCompound={'حداشر':11,'احداشر':11,'حدعش':11,
  'اثناشر':12,'اتناشر':12,'اطناش':12,
  'تلتاشر':13,'تلاتاشر':13,'ثلطاشر':13,
  'اربعتاشر':14,'اربعطاشر':14,
  'خمستاشر':15,'خمسطاشر':15,
  'سطاشر':16,'ستاشر':16,'ستطاشر':16,
  'سبعتاشر':17,'سبعطاشر':17,
  'تمنتاشر':18,'تمانتاشر':18,'تمنطاشر':18,
  'تسعتاشر':19,'تسعطاشر':19};
 const tens={'عشرون':20,'عشرين':20,'ثلاثون':30,'ثلاثين':30,'تلاتين':30,'تلاتون':30,
  'أربعون':40,'اربعون':40,'أربعين':40,'اربعين':40,
  'خمسون':50,'خمسين':50,'ستون':60,'ستين':60,
  'سبعون':70,'سبعين':70,'ثمانون':80,'ثمانين':80,'تمانين':80,'تمانون':80,
  'تسعون':90,'تسعين':90};
 const hundredsWord={'مائة':100,'مئة':100,'مية':100};
 const hundredsCompound={'مئتان':200,'مئتين':200,'مائتان':200,'مائتين':200,'ميتين':200,
  'ثلاثمائة':300,'ثلاثمئة':300,'تلتمية':300,'ثلاثمية':300,'تلاتمية':300,
  'أربعمائة':400,'اربعمائة':400,'اربعمية':400,
  'خمسمائة':500,'خمسمية':500,
  'ستمائة':600,'ستمية':600,
  'سبعمائة':700,'سبعمية':700,
  'ثمانمائة':800,'تمنمية':800,'تمانمية':800,
  'تسعمائة':900,'تسعمية':900};
 const thousandsWord={'ألف':1000,'الف':1000};
 const thousandsCompound={'ألفين':2000,'الفين':2000};
 const fractionWords={'نص':0.5,'نصف':0.5,'ربع':0.25};

 let words=text.replace(/[^؀-ۿ\s]/g,' ').trim().split(/\s+/).filter(Boolean);
 words=words.map(w=>{
  for(const prefix of ['و','ب']){
   if(w.length>prefix.length && w.startsWith(prefix)){
    const rest=w.slice(prefix.length);
    if(ones[rest]!==undefined||teensCompound[rest]!==undefined||tens[rest]!==undefined||hundredsWord[rest]!==undefined||
       hundredsCompound[rest]!==undefined||thousandsWord[rest]!==undefined||
       thousandsCompound[rest]!==undefined||fractionWords[rest]!==undefined||rest==='عشرة') return rest;
   }
  }
  return w;
 });

 let total=0, group=0, matched=false, fraction=0;
 for(let i=0;i<words.length;i++){
  const w=words[i], next=words[i+1];
  if(fractionWords[w]!==undefined){ fraction+=fractionWords[w]; matched=true; continue; }
  if(thousandsCompound[w]!==undefined){ total+=thousandsCompound[w]; group=0; matched=true; continue; }
  if(thousandsWord[w]!==undefined){ total += (group>0?group:1)*1000; group=0; matched=true; continue; }
  if(hundredsCompound[w]!==undefined){ group+=hundredsCompound[w]; matched=true; continue; }
  if(hundredsWord[w]!==undefined){ group = (group>0 && group<10) ? group*100 : group+100; matched=true; continue; }
  if(teensCompound[w]!==undefined){ group+=teensCompound[w]; matched=true; continue; }
  if(w==='عشرة'){ group+=10; matched=true; continue; }
  if(tens[w]!==undefined){ group+=tens[w]; matched=true; continue; }
  if(ones[w]!==undefined){
   if(next==='عشر'){ group += ones[w]+10; i++; matched=true; continue; }
   group += ones[w]; matched=true; continue;
  }
 }
 total += group + fraction;
 return matched ? total : null;
}

/* ============ فهم الأرقام المنطوقة بالإنجليزي ============ */
function englishWordsToNumber(text){
 const ones={'zero':0,'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,
  'ten':10,'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,'seventeen':17,
  'eighteen':18,'nineteen':19};
 const tens={'twenty':20,'thirty':30,'forty':40,'fifty':50,'sixty':60,'seventy':70,'eighty':80,'ninety':90};
 const words=text.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
 let total=0, group=0, matched=false;
 for(const w of words){
  if(w==='and') continue;
  if(w==='hundred'){ group=(group>0?group:1)*100; matched=true; continue; }
  if(w==='thousand'){ total += (group>0?group:1)*1000; group=0; matched=true; continue; }
  if(tens[w]!==undefined){ group+=tens[w]; matched=true; continue; }
  if(ones[w]!==undefined){ group+=ones[w]; matched=true; continue; }
 }
 total+=group;
 return matched ? total : null;
}

function parseAmount(text){
 const digitMatch = text.match(/\d+(\.\d+)?/);
 if(digitMatch) return parseFloat(digitMatch[0]);
 const arNum = arabicWordsToNumber(text);
 if(arNum!==null && arNum>0) return arNum;
 const enNum = englishWordsToNumber(text);
 if(enNum!==null && enNum>0) return enNum;
 return 0;
}

function detectCategory(text){
 const words = text.split(/\s+/).map(w=>w.replace(/^ال/,'').toLowerCase());
 for(const w of words){
  for(const cat of categories){
   if(cat.keywords.some(k=>k.toLowerCase()===w)) return cat.id;
  }
 }
 return 'other';
}

let statusKey = 'statusReady';
let voiceActive = false;
let lastAutoSavedText = null;
function setStatus(key){

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){showAlertModal(tr('voiceNotSupportedAlert'));return;}
 if(voiceActive) return; // تفادي بدء جلسة استماع جديدة فوق جلسة لسه شغالة (سبب شائع لعدم الاستجابة)
 const btn = document.getElementById('voiceBtn');
 let r=new SpeechRecognition();
 r.lang = lang==='ar' ? "ar-LY" : "en-US";
 r.interimResults = true; // لإظهار النص أول بأول أثناء الكلام، عشان يبان إن التطبيق يسمع فعلاً
 r.maxAlternatives = 1;

 voiceActive = true;
 btn.disabled = true;
 try {
  r.start();
 } catch(err){
  voiceActive = false;
  btn.disabled = false;
  setStatus('statusError');
  return;
 }

 r.onstart = ()=>{ setStatus('statusListening'); };
 r.onaudiostart = ()=>{ setStatus('statusListening'); };

 r.onresult = e=>{
  let transcript = '';
  for(let i=0; i<e.results.length; i++){ transcript += e.results[i][0].transcript; }
  document.getElementById('text').value = transcript;
  updatePreview();
  const last = e.results[e.results.length-1];
  if(last.isFinal){
   setStatus('statusCaptured');
   if(parseAmount(transcript)>0){
    lastAutoSavedText = transcript.trim();
    saveExpense(true);
   }
  }
 };

 r.onerror = ()=>{ setStatus('statusError'); };

 r.onend = ()=>{
  voiceActive = false;
  btn.disabled = false;
  // لو انتهت الجلسة بدون أي نتيجة (سكوت مثلاً)، نرجّع الحالة عشان الضغطة الجاية تشتغل من أول مرة
  if(statusKey==='statusListening') setStatus('statusError');
 };
}

function handleTextKeydown(e){

function attemptAutoSaveFromText(){

 if(!t){ showAlertModal(tr('emptyExpenseAlert')); return; }
 if(t === lastAutoSavedText) return; // تفادي حفظ مكرر لنفس النص

 if(amount<=0){ showAlertModal(tr('amountNotDetectedAlert')); return; }
 lastAutoSavedText = t;

function updatePreview(){

 const p = document.getElementById('preview');
 lastAutoSavedText = null; // أي تعديل يدوي جديد على النص يفتح الباب لحفظ جديد

 const amount = parseAmount(t);

  if(amount>0) p.innerText = amount + ' ' + currency() + ' — ' + tr('armedPreviewSuffix')(catName(findCategory(armedCategoryId)));

/* ============ حفظ / حذف المصروفات ============ */
function saveExpense(auto){
 const t = document.getElementById('text').value.trim();
 if(!t){ showAlertModal(tr('emptyExpenseAlert')); return; }
 const amount = parseAmount(t);
 if(amount<=0){ showAlertModal(tr('amountNotDetectedAlert')); return; }

 if(armedCategoryId){
  const armedCat = categories.find(c=>c.id===armedCategoryId);
  if(armedCat && armedCat.budget>0 && (armedCat.budget - categoryMonthSpent(armedCat.id)) < amount){
   const remaining = armedCat.budget - categoryMonthSpent(armedCat.id);
   const over = amount - remaining;
   setStatus('statusAwaitingConfirm');
   showConfirmModal(
    tr('overBudgetConfirmMsg')(catName(armedCat), over.toFixed(2), currency()),
    ()=>{ finalizeExpense(t, amount, armedCategoryId, auto); },
    ()=>{ setStatus('statusReady'); }
   );
   return;
  }
 }
 const categoryId = armedCategoryId || (document.getElementById('categorySelect').value || detectCategory(t));
 finalizeExpense(t, amount, categoryId, auto);
}

function finalizeExpense(t, amount, categoryId, auto){
 expenses.push({ id: Date.now()+Math.random(), text:t, amount, categoryId, date: new Date().toISOString() });
 saveExpenses();
 document.getElementById('text').value='';
 document.getElementById('preview').innerText='';
 setStatus(auto ? 'autoSavedStatus' : 'statusReady');
 renderAll();
}
function deleteExpense(id){
 showConfirmModal(tr('deleteConfirm'), ()=>{
  expenses = expenses.filter(x=>x.id!==id);
  saveExpenses();
  renderAll();
 }, null, tr('confirmYesDelete'));
}
function clearAllExpenses(){
 if(expenses.length===0) return;
 showConfirmModal(tr('clearAllConfirm'), ()=>{
  expenses = [];
  saveExpenses();
  renderAll();
 }, null, tr('confirmYesClearAll'));
}

 localStorage.masrofati_lang = l;
 document.getElementById('htmlRoot').lang = l;
 document.getElementById('htmlRoot').dir = l==='ar' ? 'rtl' : 'ltr';

}

/* ============ التنقل بين الشاشات ============ */

/* ============ التقارير ============ */
let reportTab = 'daily';
function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalDateStr(iso){ const d=new Date(iso); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function toLocalMonthStr(iso){ const d=new Date(iso); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
function todayStr(){ return toLocalDateStr(new Date().toISOString()); }
function thisMonthStr(){ return toLocalMonthStr(new Date().toISOString()); }

function switchReportTab(tab){
 reportTab = tab;
 document.getElementById('tabDailyBtn').className = tab==='daily' ? 'active' : '';
 document.getElementById('tabMonthlyBtn').className = tab==='monthly' ? 'active' : '';
 document.getElementById('tabAllBtn').className = tab==='all' ? 'active' : '';
 document.getElementById('dailyPicker').hidden = tab!=='daily';
 document.getElementById('monthlyPicker').hidden = tab!=='monthly';
 renderReports();
}
function onReportDateChange(){ renderReports(); }
function onReportMonthChange(){ renderReports(); }

function periodExpenses(){
 if(reportTab==='daily'){
  const dateInput = document.getElementById('reportDateInput');
  const val = dateInput.value || todayStr();
  return expenses.filter(x => toLocalDateStr(x.date) === val);
 }
 if(reportTab==='monthly'){
  const monthInput = document.getElementById('reportMonthInput');
  const val = monthInput.value || thisMonthStr();
  return expenses.filter(x => toLocalMonthStr(x.date) === val);
 }
 return expenses.slice();
}

function updateReportCategoryFilter(){
 const el = document.getElementById('reportCategoryFilter');
 if(armedCategoryId){
  el.hidden = false;
  document.getElementById('reportCategoryFilterText').innerText = tr('reportFilterPrefix') + ' ' + catName(findCategory(armedCategoryId));
 } else {
  el.hidden = true;
 }
}

function renderReports(){
 updateReportCategoryFilter();
 let list = periodExpenses();
 // لو فيه تصنيف محدد من القائمة الرئيسية، التقرير يقتصر عليه فقط
 if(armedCategoryId){ list = list.filter(x => x.categoryId === armedCategoryId); }
 const total = list.reduce((s,x)=>s+x.amount,0);
 document.getElementById('periodTotal').innerText = tr('totalForPeriod')(total.toFixed(2), currency());

 const catTotals = {};
 list.forEach(x=>{ catTotals[x.categoryId] = (catTotals[x.categoryId]||0) + x.amount; });
 const catReport = document.getElementById('periodCatReport');
 const relevantIds = new Set(Object.keys(catTotals));
 if(reportTab==='monthly' && !armedCategoryId){
  categories.forEach(c=>{ if(c.budget>0) relevantIds.add(c.id); });
 }
 const ids = Array.from(relevantIds);
 if(ids.length===0){
  catReport.innerHTML = `<div class="muted">${tr('noExpensesMsg')}</div>`;
 } else {
  ids.sort((a,b)=>(catTotals[b]||0)-(catTotals[a]||0));
  catReport.innerHTML = ids.map(id=>{
   const cat = findCategory(id);
   const spent = catTotals[id]||0;
   if(reportTab==='monthly' && cat.budget>0){
    const pct = Math.min(100, (spent/cat.budget)*100);
    let color = '#4caf50';
    if(spent>cat.budget) color='#e53935';
    else if(spent>=cat.budget*0.9) color='#f9a825';
    return `<div style="margin-top:10px">
     <div class="cat-row" style="border-bottom:0;padding-bottom:2px">
      <span>${catName(cat)}</span><span>${tr('budgetProgress')(spent.toFixed(2), cat.budget.toFixed(2), currency())}</span>
     </div>
     <div class="bar-outer" style="margin-top:2px"><div class="bar-inner" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
   }
   return `<div class="cat-row"><span>${catName(cat)}</span><span>${spent.toFixed(2)} ${currency()}${(reportTab==='monthly'&&cat.budget===0)?' ('+tr('noBudgetSet')+')':''}</span></div>`;
  }).join('');
 }

 const expList = document.getElementById('periodExpenseList');
 if(list.length===0){
  expList.innerHTML = `<div class="muted">${tr('noExpensesLog')}</div>`;
 } else {
  const sorted = list.slice().sort((a,b)=> new Date(b.date) - new Date(a.date));
  expList.innerHTML = sorted.map(x => `
   <div class="exp-item">
    <div class="exp-info">
     <div class="exp-top"><span class="exp-cat">${catName(findCategory(x.categoryId))}</span><span class="exp-amount">${x.amount} ${currency()}</span></div>
     <div class="exp-text">${x.text}</div>
     <div class="exp-date">${formatDate(x.date)}</div>
    </div>
    <button class="del-btn" onclick="deleteExpense(${x.id})">×</button>
   </div>
  `).join('');
 }
}

/* ============ قفل الخصوصية ============ */
function simpleHash(str){
 let h=0;
 for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; }
 return h.toString(36);
}
function setPin(){
 const v = document.getElementById('newPinInput').value;
 if(!v || v.length<4){ showAlertModal(tr('pinTooShortAlert')); return; }
 localStorage.masrofati_pin = simpleHash(v);
 document.getElementById('newPinInput').value='';
 showAlertModal(tr('pinSetAlert'));
}
function removePin(){
 if(!localStorage.masrofati_pin){ showAlertModal(tr('noPinToRemoveAlert')); return; }
 delete localStorage.masrofati_pin;
 showAlertModal(tr('pinRemovedAlert'));
}
function tryUnlock(){
 const v = document.getElementById('lockPinInput').value;
 if(simpleHash(v) === localStorage.masrofati_pin){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  init();
 } else {
  document.getElementById('lockWrongMsg').style.display='block';
  document.getElementById('lockWrongMsg').innerText = tr('wrongPinAlert');
 }
}

/* ============ النسخ الاحتياطي ============ */
function exportBackup(){
 const data = { budget: totalBudget(), expenses, categories, occupation: localStorage.masrofati_occupation||'', lang, country: countryId, pin: localStorage.masrofati_pin||null, exportedAt: new Date().toISOString() };
 const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = 'masrofati_backup_' + new Date().toISOString().slice(0,10) + '.json';
 document.body.appendChild(a);
 a.click();
 a.remove();
 URL.revokeObjectURL(url);
}
function importBackup(ev){
 const file = ev.target.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload = ()=>{
  let data;
  try { data = JSON.parse(reader.result); } catch(e){ showAlertModal(tr('importErrorAlert')); return; }
  if(!Array.isArray(data.expenses) || !Array.isArray(data.categories)){ showAlertModal(tr('importErrorAlert')); return; }
  showConfirmModal(tr('importConfirm'), ()=>{
   localStorage.expenses = JSON.stringify(data.expenses);
   if(Array.isArray(data.categories)) localStorage.masrofati_categories = JSON.stringify(data.categories);
   if(data.occupation!==undefined) localStorage.masrofati_occupation = data.occupation;
   if(data.lang) localStorage.masrofati_lang = data.lang;
   if(data.country && COUNTRIES.some(c=>c.id===data.country)) localStorage.masrofati_country = data.country;
   if(data.pin) localStorage.masrofati_pin = data.pin; else delete localStorage.masrofati_pin;
   showAlertModal(tr('importSuccessAlert'), ()=>{ location.reload(); });
  }, null, tr('confirmYesImport'));
 };
 reader.readAsText(file);
 ev.target.value='';
}

function formatDate(iso){
 const locale = lang==='ar' ? 'ar-LY' : 'en-GB';
 const d = new Date(iso);
 return d.toLocaleDateString(locale) + ' - ' + d.toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'});
}

function renderCategorySelect(){
 const sel = document.getElementById('categorySelect');
 const current = sel.value;
 sel.innerHTML = categories.map(c=>`<option value="${c.id}">${catName(c)}</option>`).join('');
 if(current && categories.some(c=>c.id===current)) sel.value = current;
}

function renderCategoryList(){
 const list = document.getElementById('categoryList');
 list.innerHTML = categories.map(c => {
  const spent = categoryMonthSpent(c.id);
  const hasBudget = c.budget>0;
  let statLine = `<div class="cat-stat">${tr('catSpentLabel')}: ${spent.toFixed(2)} ${currency()}</div>`;
  if(hasBudget){
   const remaining = c.budget - spent;
   const color = remaining<0 ? '#b3261e' : (spent>=c.budget*0.9 ? '#8d6e00' : '#1b5e20');
   const remainingText = remaining<0
    ? `${tr('catOverLabel')} ${Math.abs(remaining).toFixed(2)} ${currency()}`
    : `${tr('catRemainingLabel')}: ${remaining.toFixed(2)} ${currency()}`;
   const pct = Math.min(100, (spent/c.budget)*100);
   const barColor = remaining<0 ? '#e53935' : (spent>=c.budget*0.9 ? '#f9a825' : '#4caf50');
   statLine += `<div class="cat-remaining" style="color:${color}">${remainingText}</div>
    <div class="bar-outer" style="margin-top:6px"><div class="bar-inner" style="width:${pct}%;background:${barColor}"></div></div>`;
  }
  const armed = armedCategoryId===c.id;
  return `
  <div class="cat-card${armed?' armed':''}" onclick="armCategory('${c.id}')">
   <div class="cat-card-top">
    <span class="cat-card-name">${catName(c)}</span>
    ${c.protected ? '' : `<button class="cat-del" onclick="event.stopPropagation();deleteCategory('${c.id}')">×</button>`}
   </div>
   <label>${tr('catBudgetLabel')}</label>
   <input type="number" inputmode="decimal" value="${c.budget||''}" placeholder="${tr('noBudgetSet')}" onclick="event.stopPropagation()" onchange="setCategoryBudget('${c.id}', this.value)">
   ${statLine}
   ${armed ? `<div class="cat-armed-badge">${tr('armedBadge')}</div>` : ''}
  </div>`;
 }).join('');

 document.getElementById('categoryTotalRow').innerHTML =
  `<span>${tr('categoryTotalLabel')}</span><span>${totalBudget().toFixed(2)} ${currency()}</span>`;

 updateArmedIndicator();
}

function updateArmedIndicator(){
 const indicator = document.getElementById('armedIndicator');
 const sel = document.getElementById('categorySelect');
 if(armedCategoryId){
  indicator.hidden = false;
  document.getElementById('armedIndicatorText').innerText = tr('armedIndicatorPrefix') + ' ' + catName(findCategory(armedCategoryId));
  sel.value = armedCategoryId;
  sel.disabled = true;
 } else {
  indicator.hidden = true;
  sel.disabled = false;
 }
}

function renderHeader(){
 const budget = totalBudget();
 const spent = monthSpent();
 document.getElementById('b').innerText = budget.toFixed(2);
 document.getElementById('s').innerText = spent.toFixed(2);

 const bar = document.getElementById('bar');
 const banner = document.getElementById('banner');
 if(budget<=0){
  bar.style.width='0%';
  banner.hidden = true;
 } else {
  banner.hidden = false;
  const pct = Math.min(100, (spent/budget)*100);
  bar.style.width = pct+'%';
  if(spent>budget){
   bar.style.background='#e53935';
   banner.className='banner over';
   banner.innerText = tr('overBanner')((spent-budget).toFixed(2), currency());
  } else if(spent >= budget*0.9){
   bar.style.background='#f9a825';
   banner.className='banner mid';
   banner.innerText = tr('midBanner')((budget-spent).toFixed(2), currency());
  } else {
   bar.style.background='#4caf50';
   banner.className='banner ok';
   banner.innerText = tr('okBanner')((budget-spent).toFixed(2), currency());
  }
 }
}

function renderCountrySelect(){

function renderAll(){
 applyStaticText();
 renderCountrySelect();
 renderCategorySelect();
 renderCategoryList();
 renderHeader();

}

/* ============ البدء ============ */
function init(){
 document.getElementById('htmlRoot').lang = lang;
 document.getElementById('htmlRoot').dir = lang==='ar' ? 'rtl' : 'ltr';
 document.getElementById('reportDateInput').value = todayStr();
 document.getElementById('reportMonthInput').value = thisMonthStr();
 switchReportTab('daily');
 showView('home');
}
if(localStorage.masrofati_pin){
 document.getElementById('lockScreen').style.display='flex';
 document.getElementById('app').style.display='none';
 document.getElementById('lockTitle').innerText = tr('lockTitle');
 document.getElementById('lockPinInput').placeholder = tr('lockPlaceholder');
 document.getElementById('unlockBtn').innerText = tr('unlockBtn');
} else {
 init();
}
</script>
<script>
// ============ شاشة البداية (تصميم م. محمد الصديق العكى) ============
let splashDismissed = false;
function dismissSplash(){
 if(splashDismissed) return;
 splashDismissed = true;
 const splash = document.getElementById('splashScreen');
 if(!splash) return;
 splash.style.opacity = '0';
 setTimeout(()=>{ splash.hidden = true; splash.style.display='none'; }, 400);
}
setTimeout(dismissSplash, 1800);

// تسجيل service worker لتشغيل التطبيق بدون إنترنت وتفعيل التثبيت على الهاتف
if('serviceWorker' in navigator){
 window.addEventListener('load', function(){
  navigator.serviceWorker.register('sw.js').catch(function(err){
   console.warn('SW registration failed:', err);
  });
 });
}
</script>
